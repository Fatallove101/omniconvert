[package]
name = "omniconvert"
version = "0.2.0"
edition = "2021"
description = "万象转换 OmniConvert — 本地文件格式转换"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
